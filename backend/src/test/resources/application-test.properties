# ── Server ──────────────────────────────
server.port=0
spring.threads.virtual.enabled=true

# ── Database (in-memory H2 for tests) ───
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Object-Store ────────────────────────
seaweedfs.access-key=test-access-key
seaweedfs.secret-key=test-secret-key
seaweedfs.s3.public-endpoint=http://localhost:8333

# ── Redis ───────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# ── Security (test credentials only) ────
spring.security.user.name=admin
spring.security.user.password=test-password

# ── Sample data ──────────────────────────
app.seed-sample-resources=false

# ── JWT ──────────────────────────────────
