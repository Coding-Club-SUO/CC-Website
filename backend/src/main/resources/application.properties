# ── Server ────────────────────────────────────
server.port=8000
spring.profiles.active=dev

# ── Database ──────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:mydb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=PLACEHOLDER
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Redis ───────────────────────────
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=PLACEHOLDER

# ── Security (dev credentials — change for production)
spring.security.user.name=admin
spring.security.user.password=PLACEHOLDER

# ── Sample data ───────────────────────────────
# Seeds placeholder course resources on startup for local/demo use.
# Set to false in production to keep sample data out of the real database.
app.seed-sample-resources=true

# ── JWT ──────────────────────────────────
spring.jwt.secret.access=PLACEHOLDER
spring.jwt.secret.refresh=PLACEHOLDER
spring.jwt.access.expiration=600
spring.jwt.refresh.expiration=86400
spring.jwt.max.refresh.expiration=2592000
