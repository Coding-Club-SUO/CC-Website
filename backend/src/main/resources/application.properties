# ── Server ────────────────────────────────────
server.port=8080

# ── Database ──────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/CCWebsite
spring.datasource.username=postgres
spring.datasource.password=PLACEHOLDER
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Security (dev credentials — change for production)
spring.security.user.name=admin
spring.security.user.password=PLACEHOLDER

# ── Sample data ───────────────────────────────
# Seeds placeholder course resources on startup for local/demo use.
# Set to false in production to keep sample data out of the real database.
app.seed-sample-resources=true

# ── File storage ──────────────────────────────
# Directory where uploaded files are written. In a container this points at a
# mounted Docker volume (e.g. /data/resources) so uploads survive restarts.
app.storage.location=uploads

# ── Multipart uploads ─────────────────────────
# Matches the 10 MB cap the frontend enforces; request cap leaves headroom for fields.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── JWT ──────────────────────────────────
spring.jwt.secret.access=PLACEHOLDER
spring.jwt.secret.refresh=PLACEHOLDER
spring.jwt.access.expiration=3600000
spring.jwt.refresh.expiration=4600000
